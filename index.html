<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripForge — Agent Playground</title>
<style>
  :root {
    --bg: #050816;
    --panel: #121728;
    --panel-2: #1b243b;
    --accent-pink: #ff2ea8;
    --accent-yellow: #ffbf2f;
    --accent-teal: #2ce8ff;
    --accent-blue: #7dff5b;
    --text: #f7fbff;
    --text-dim: #95a8c8;
    --on: #2ce8ff;
    --off: #2c3a54;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top left, #1e2740 0%, #080b18 55%, #050816 100%);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    padding: 20px 28px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-bottom: 3px solid var(--accent-pink);
    background: linear-gradient(90deg, #11172a, #1a243d 45%, #11172a);
    box-shadow: 0 0 24px rgba(44, 232, 255, 0.12);
  }

  header h1 {
    margin: 0;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--accent-pink), var(--accent-yellow), var(--accent-teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 16px rgba(255, 46, 168, 0.2);
  }

  header span {
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .prompt-bar {
    display: flex;
    gap: 10px;
    padding: 16px 28px;
    background: rgba(18, 23, 40, 0.92);
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(44, 232, 255, 0.18);
  }

  .prompt-bar textarea {
    flex: 1;
    min-width: 260px;
    min-height: 46px;
    max-height: 120px;
    resize: vertical;
    background: #060b16;
    color: var(--text);
    border: 2px solid rgba(44, 232, 255, 0.45);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
    box-shadow: inset 0 0 0 1px rgba(255, 191, 47, 0.08);
  }

  #runBtn {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-yellow));
    border: none;
    color: #07111e;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 26px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 10px 24px rgba(255, 46, 168, 0.24);
    transition: transform 0.08s ease;
  }
  #runBtn:hover { transform: translateY(-2px); }
  #runBtn:active { transform: translateY(1px); box-shadow: 0 2px 0 #a8306f; }
  #runBtn:disabled { opacity: 0.6; cursor: not-allowed; }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    gap: 16px;
    padding: 16px 28px 28px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, rgba(18, 23, 40, 0.98), rgba(27, 36, 59, 0.96));
    border-radius: 14px;
    padding: 16px;
    min-height: 420px;
    border: 1px solid rgba(44, 232, 255, 0.16);
    box-shadow: 0 12px 30px rgba(2, 7, 18, 0.45);
  }

  .panel h2 {
    margin: 0 0 12px;
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-teal);
    text-shadow: 0 0 10px rgba(44, 232, 255, 0.16);
  }

  /* Agent toggles */
  .agent-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }

  .agent-toggle .name {
    font-size: 0.85rem;
  }

  .switch {
    width: 46px;
    height: 24px;
    border-radius: 999px;
    background: var(--off);
    position: relative;
    cursor: pointer;
    border: none;
    flex-shrink: 0;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s ease;
  }

  .switch.on { background: var(--on); }
  .switch.on::after { left: 25px; }

  /* Outputs */
  .output-card {
    background: var(--panel-2);
    border-left: 5px solid var(--accent-blue);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .output-card h3 {
    margin: 0 0 8px;
    font-size: 0.95rem;
    color: var(--accent-yellow);
  }

  .output-card p {
    margin: 0;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
  }

  .output-card.error { border-left-color: #ff5e5e; }
  .output-card.error h3 { color: #ff8080; }

  .empty-hint {
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* Trace */
  .trace-item {
    display: flex;
    gap: 8px;
    font-size: 0.78rem;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid #332c6b;
  }

  .trace-item .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
    background: var(--accent-teal);
  }

  .trace-item.error .dot { background: #ff5e5e; }
  .trace-item.running .dot { background: var(--accent-yellow); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .trace-item .content { flex: 1; }
  .trace-item .time { color: var(--text-dim); }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: var(--accent-yellow);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>TripForge Agent Playground</h1>
  <span>toggle agents · run the chain · watch it think</span>
</header>

<div class="prompt-bar">
  <textarea id="userInput" placeholder="e.g. I have 8 days in Japan with a $3,500 budget. I love anime, sushi, photography, hiking, and trains.">I have 8 days in Japan with a $3,500 budget. I love anime, sushi, photography, hiking, and trains.</textarea>
  <button id="runBtn">▶ Run Agents</button>
</div>

<div class="layout">
  <div class="panel" id="agentPanel">
    <h2>Agents</h2>
    <!-- agent toggles injected by JS -->
  </div>

  <div class="panel" id="outputPanel">
    <h2>Agent Outputs</h2>
    <p class="empty-hint" id="outputEmptyHint">Turn on some agents and hit Run Agents to see results here.</p>
  </div>

  <div class="panel" id="tracePanel">
    <h2>Workflow Trace</h2>
    <p class="empty-hint" id="traceEmptyHint">No runs yet.</p>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // ⚠️ Heads up: the API key below is visible to anyone who views
  // this page's source or opens dev tools. That's OK for a local
  // prototype, but never ship a real key this way — route calls
  // through a backend instead.
  // ---------------------------------------------------------------
  const API_URL = "https://vibe-proxy-gqv4.onrender.com/v1/chat/completions";
  const API_KEY = "sk-vibe-summer-2026";
  const MODEL = "class-chat-model";

  // Agents run in this fixed order when turned on.
  const AGENTS = [
    {
      id: "destination",
      name: "🗺️ Destination Research",
      color: "#ff2ea8",
      role: "You are the Destination Research Agent for a travel planning system. Focus only on destination recommendations, local highlights, hidden gems, seasonal notes, and safety-at-a-glance. Be concise (under 150 words)."
    },
    {
      id: "flight",
      name: "✈️ Flight",
      color: "#2ce8ff",
      role: "You are the Flight Agent. Focus only on flight suggestions, likely airports, travel times, stopovers, and airline comparisons. Be concise (under 150 words)."
    },
    {
      id: "hotel",
      name: "🏨 Hotel",
      color: "#ffbf2f",
      role: "You are the Hotel Agent. Focus only on accommodation options across budget, mid-range, and luxury tiers, amenities, and family-friendliness. Be concise (under 150 words)."
    },
    {
      id: "transportation",
      name: "🚆 Transportation",
      color: "#7dff5b",
      role: "You are the Transportation Agent. Focus only on trains, buses, rental cars, metro systems, taxis, and ride-sharing for getting around. Be concise (under 150 words)."
    },
    {
      id: "budget",
      name: "💰 Budget",
      color: "#ffd23f",
      role: "You are the Budget Agent. Focus only on estimated costs: daily spending, transportation, hotel, food, and attraction costs. Give rough numbers. Be concise (under 150 words)."
    },
    {
      id: "weather",
      name: "🌦️ Weather",
      color: "#5b7cff",
      role: "You are the Weather Agent. Focus only on forecasts, seasonal expectations, and clothing recommendations. Be concise (under 120 words)."
    },
    {
      id: "activity",
      name: "🎯 Activity",
      color: "#ff5eb0",
      role: "You are the Activity Agent. Focus only on museums, beaches, hiking, nightlife, family activities, adventure sports, and local events matching the traveler's interests. Be concise (under 150 words)."
    },
    {
      id: "food",
      name: "🍣 Food",
      color: "#35e0c9",
      role: "You are the Food Agent. Focus only on restaurant recommendations, local cuisine, dietary considerations, and food markets. Be concise (under 150 words)."
    },
    {
      id: "packing",
      name: "🎒 Packing",
      color: "#ffd23f",
      role: "You are the Packing Agent. Focus only on a weather-based, activity-specific packing checklist plus travel documents, electronics, and medications. Be concise (under 150 words)."
    },
    {
      id: "safety",
      name: "🛟 Safety",
      color: "#5b7cff",
      role: "You are the Safety Agent. Focus only on travel advisories, emergency numbers, common scams, local customs, and health considerations. Be concise (under 120 words)."
    }
  ];

  const agentState = {};
  AGENTS.forEach(a => agentState[a.id] = true); // default: all ON

  const agentPanel = document.getElementById("agentPanel");
  AGENTS.forEach(agent => {
    const row = document.createElement("div");
    row.className = "agent-toggle";
    row.innerHTML = `
      <span class="name">${agent.name}</span>
      <button class="switch on" data-id="${agent.id}" aria-label="Toggle ${agent.name}"></button>
    `;
    agentPanel.appendChild(row);
  });

  agentPanel.addEventListener("click", (e) => {
    const btn = e.target.closest(".switch");
    if (!btn) return;
    const id = btn.dataset.id;
    agentState[id] = !agentState[id];
    btn.classList.toggle("on", agentState[id]);
  });

  const outputPanel = document.getElementById("outputPanel");
  const tracePanel = document.getElementById("tracePanel");
  const runBtn = document.getElementById("runBtn");
  const userInputEl = document.getElementById("userInput");

  function timeStr() {
    return new Date().toLocaleTimeString();
  }

  function clearEmptyHints() {
    const oh = document.getElementById("outputEmptyHint");
    const th = document.getElementById("traceEmptyHint");
    if (oh) oh.remove();
    if (th) th.remove();
  }

  function addTrace(text, status) {
    clearEmptyHints();
    const item = document.createElement("div");
    item.className = "trace-item" + (status ? " " + status : "");
    item.innerHTML = `
      <div class="dot"></div>
      <div class="content">
        <div class="time">${timeStr()}</div>
        <div>${text}</div>
      </div>
    `;
    tracePanel.appendChild(item);
    tracePanel.scrollTop = tracePanel.scrollHeight;
    return item;
  }

  function addOutputCard(agent) {
    clearEmptyHints();
    const card = document.createElement("div");
    card.className = "output-card";
    card.style.borderLeftColor = agent.color;
    card.innerHTML = `
      <h3>${agent.name} <span class="spinner"></span></h3>
      <p>Thinking...</p>
    `;
    outputPanel.appendChild(card);
    return card;
  }

  async function callAgent(agent, userMessage) {
    const body = {
      model: MODEL,
      messages: [
        { role: "user", content: `${agent.role}\n\nTraveler request and context so far:\n${userMessage}` }
      ]
    };

    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => res.statusText);
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const content = data?.choices?.[0]?.message?.content
      ?? data?.content?.[0]?.text
      ?? JSON.stringify(data);
    return content;
  }

  async function runAgents() {
    const userMessage = userInputEl.value.trim();
    if (!userMessage) {
      alert("Type a trip request first!");
      return;
    }

    const activeAgents = AGENTS.filter(a => agentState[a.id]);
    if (activeAgents.length === 0) {
      alert("Turn on at least one agent.");
      return;
    }

    // Reset panels for a fresh run
    outputPanel.querySelectorAll(".output-card").forEach(el => el.remove());
    tracePanel.querySelectorAll(".trace-item").forEach(el => el.remove());

    runBtn.disabled = true;
    runBtn.textContent = "⏳ Running...";

    addTrace(`Orchestrator received request: "${userMessage}"`);
    addTrace(`Active agents (in order): ${activeAgents.map(a => a.name).join(" → ")}`);

    // Rolling context that gets passed from one agent to the next
    let context = userMessage;

    for (const agent of activeAgents) {
      const traceItem = addTrace(`Running ${agent.name}...`, "running");
      const outputCard = addOutputCard(agent);

      try {
        const result = await callAgent(agent, context);

        outputCard.innerHTML = `<h3>${agent.name}</h3><p>${escapeHtml(result)}</p>`;
        traceItem.classList.remove("running");
        traceItem.querySelector(".content div:last-child").textContent = `${agent.name} completed.`;

        // Chain: feed this agent's output into the next agent's context
        context += `\n\n--- ${agent.name} output ---\n${result}`;
      } catch (err) {
        outputCard.classList.add("error");
        outputCard.innerHTML = `<h3>${agent.name} — failed</h3><p>${escapeHtml(err.message)}</p>`;
        traceItem.classList.remove("running");
        traceItem.classList.add("error");
        traceItem.querySelector(".content div:last-child").textContent = `${agent.name} failed: ${err.message}`;
        // Continue with remaining agents even if one fails
      }
    }

    addTrace("Orchestrator finished combining agent outputs.");
    runBtn.disabled = false;
    runBtn.textContent = "▶ Run Agents";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  runBtn.addEventListener("click", runAgents);
</script>

</body>
</html>
